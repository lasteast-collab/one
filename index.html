<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LASTEAST — Stream Your Software</title>
<meta name="description" content="LASTEAST — a cinematic streaming platform for apps, software, AI tools and projects.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M18 12h9v32h19v8H18z' fill='%23e50914'/%3E%3Cpath d='M10 56C26 36 42 28 58 26' stroke='%23ff3b3b' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#e50914; --accent-2:#ff3b3b;
  --bg:#050505; --bg-2:#0d0d0d; --panel:#141414; --panel-2:#1c1c1c; --line:rgba(255,255,255,.09);
  --fg:#ffffff; --fg-2:#d4d4d4; --muted:#8f8f8f;
  --shadow:0 18px 50px rgba(0,0,0,.6);
  --radius:10px; --pad:4vw; --nav-h:68px;
  --font:'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
:root.light{
  --bg:#f3f0ee; --bg-2:#e9e5e2; --panel:#ffffff; --panel-2:#f6f3f1; --line:rgba(0,0,0,.1);
  --fg:#121212; --fg-2:#333; --muted:#6b6b6b; --shadow:0 18px 40px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%}
a{color:inherit}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.fill{fill:currentColor;stroke:none}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#333;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ambient background */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient::before,.ambient::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.12;background:radial-gradient(circle,var(--accent),transparent 65%);animation:drift 26s ease-in-out infinite alternate}
.ambient::before{top:-30vmax;left:-20vmax}
.ambient::after{bottom:-40vmax;right:-25vmax;animation-duration:34s;opacity:.08}
:root.light .ambient::before,:root.light .ambient::after{opacity:.07}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}

/* ============ INTRO ============ */
#intro{position:fixed;inset:0;z-index:1000;background:#000;display:grid;place-items:center;overflow:hidden;cursor:default}
#intro[hidden]{display:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
.intro-glow{position:absolute;left:50%;top:50%;width:110vmax;height:55vmax;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(229,9,20,.55),rgba(120,0,0,.22) 45%,transparent 75%);opacity:0;animation:glowIn 1.8s .15s ease-out forwards,glowPulse 2.2s 2s ease-in-out infinite alternate}
@keyframes glowIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes glowPulse{to{opacity:.75;transform:translate(-50%,-50%) scale(1.06)}}
.intro-logo{position:relative;width:min(94vw,1150px);aspect-ratio:2216/709;animation:logoScale 4.4s cubic-bezier(.16,.8,.2,1) forwards;-webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 46%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 62% 70% at 50% 46%,#000 55%,transparent 100%)}
.intro-logo img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:0;
  -webkit-mask-image:linear-gradient(90deg,#000 42%,transparent 58%);mask-image:linear-gradient(90deg,#000 42%,transparent 58%);
  -webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:logoReveal 2s .75s cubic-bezier(.45,.05,.25,1) forwards,logoLight 3.2s .75s ease-out forwards}
@keyframes logoReveal{0%{opacity:1;-webkit-mask-position:100% 0;mask-position:100% 0}100%{opacity:1;-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes logoLight{0%{filter:brightness(.25) blur(12px) saturate(1.6)}45%{filter:brightness(1.5) blur(0) saturate(1.2)}70%{filter:brightness(1.12) blur(0)}100%{filter:brightness(1.05) blur(0)}}
@keyframes logoScale{0%{transform:scale(1.22) perspective(900px) rotateX(10deg)}70%{transform:scale(1.02) perspective(900px) rotateX(0)}100%{transform:scale(1) perspective(900px) rotateX(0)}}
.intro-shine{position:absolute;left:10.15%;top:22.57%;width:82.13%;height:40.9%;pointer-events:none;mix-blend-mode:screen;-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
.intro-shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:22%;left:-30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.0) 20%,rgba(255,235,235,.95) 50%,rgba(255,255,255,0) 80%,transparent);transform:skewX(-18deg);animation:shine 1.1s 2.55s cubic-bezier(.5,0,.3,1) forwards;opacity:0}
@keyframes shine{0%{left:-30%;opacity:1}100%{left:120%;opacity:1}}
.intro-floor{position:absolute;left:50%;top:calc(50% + min(94vw,1150px)*.12);width:80vw;height:3px;transform:translateX(-50%) scaleX(0);background:radial-gradient(closest-side,#fff,var(--accent) 35%,transparent);filter:blur(1px);animation:floor 1.4s 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes floor{to{transform:translateX(-50%) scaleX(1)}}
.intro-ui{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:3;opacity:0;animation:fadeIn .6s .5s forwards}
.intro-ui button{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:14px;font-weight:500;letter-spacing:.02em;backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
.intro-ui button:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5)}
.intro-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,#000 100%);pointer-events:none}
#intro.out{animation:introOut .85s cubic-bezier(.6,0,.3,1) forwards}
#intro.out .intro-logo{animation:logoOut .85s cubic-bezier(.6,0,.3,1) forwards}
@keyframes introOut{0%{opacity:1}55%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes logoOut{0%{transform:scale(1);filter:brightness(1)}100%{transform:scale(2.6);filter:brightness(2.2) blur(6px);opacity:0}}
@keyframes fadeIn{to{opacity:1}}
#app{position:relative;z-index:1;opacity:1}
#app.pre{opacity:0}
#app.enter{animation:appEnter 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes appEnter{from{opacity:0;transform:scale(1.04);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ============ NAV ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;gap:28px;padding:0 var(--pad);padding-top:env(safe-area-inset-top);background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,0));transition:background .35s,backdrop-filter .35s,box-shadow .35s;color:#fff}
.nav.scrolled{background:rgba(6,6,6,.82);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.06)}
:root.light .nav{background:rgba(20,16,16,.88);backdrop-filter:blur(14px)}
.hero-content.static > *{animation:none;opacity:1;transform:none}
:root.light .rows:not(.no-hero){margin-top:0;padding-top:10px}
:root.light .hero{padding-bottom:clamp(70px,10vh,120px)}
.brand{display:flex;align-items:center;flex:none;height:100%}
.brand img{height:24px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(229,9,20,.45));transition:transform .3s,filter .3s}
.brand:hover img{transform:scale(1.04);filter:drop-shadow(0 0 16px rgba(229,9,20,.75))}
.nav-links{display:flex;gap:20px;list-style:none;align-items:center;min-width:0}
.nav-links button{font-size:14px;color:#e5e5e5;opacity:.85;padding:6px 0;white-space:nowrap;position:relative;transition:opacity .2s,color .2s}
.nav-links button:hover{opacity:1;color:#fff}
.nav-links button.active{opacity:1;font-weight:600;color:#fff}
.nav-links button.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent);border-radius:2px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#fff;transition:background .2s,transform .2s}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn svg{width:21px;height:21px}
.search-wrap{display:flex;align-items:center;height:38px;border:1px solid transparent;border-radius:6px;transition:all .35s cubic-bezier(.2,.7,.2,1);overflow:hidden}
.search-wrap.open{background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.6);width:min(320px,52vw)}
.search-wrap .icon-btn{border-radius:6px;flex:none}
.search-wrap input{width:0;opacity:0;border:0;background:transparent;outline:0;color:#fff;font-size:14px;transition:opacity .25s;min-width:0;flex:1}
.search-wrap.open input{opacity:1;width:auto;padding-right:6px}
.search-wrap kbd{display:none;font:500 11px var(--font);color:#aaa;border:1px solid #555;border-radius:4px;padding:2px 5px;margin-right:8px;flex:none}
.search-wrap.open kbd{display:inline-block}
.avatar{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#5c0006);color:#fff;font-weight:800;font-size:15px;box-shadow:0 0 0 2px rgba(255,255,255,0);transition:box-shadow .2s}
.avatar:hover{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.menu-btn{display:none}
.dropdown{position:absolute;top:calc(100% + 6px);right:var(--pad);min-width:230px;background:rgba(14,14,14,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .22s;color:#fff;backdrop-filter:blur(10px)}
.dropdown.open{opacity:1;transform:none;pointer-events:auto}
.dropdown button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:7px;font-size:14px;text-align:left}
.dropdown button:hover{background:rgba(255,255,255,.08)}
.dropdown hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:6px 4px}
.mobile-menu{left:var(--pad);right:auto}

/* ============ HERO ============ */
.hero{position:relative;height:min(92vh,880px);min-height:540px;display:flex;align-items:flex-end;padding:0 var(--pad) clamp(90px,14vh,170px);overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;transform-origin:70% 40%}
.hero-bg.show{opacity:1;animation:kenburns 22s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 32%,rgba(0,0,0,0) 65%),linear-gradient(0deg,var(--bg) 0%,transparent 34%),linear-gradient(180deg,rgba(0,0,0,.55),transparent 20%);pointer-events:none}
:root.light .hero::after{background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 32%,rgba(0,0,0,0) 65%),linear-gradient(0deg,var(--bg) 0%,transparent 34%),linear-gradient(180deg,rgba(0,0,0,.55),transparent 20%)}
.hero-content{position:relative;z-index:2;max-width:min(620px,92vw);color:#fff}
.hero-content > *{opacity:0;transform:translateY(16px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero-content > *:nth-child(2){animation-delay:.08s}.hero-content > *:nth-child(3){animation-delay:.16s}.hero-content > *:nth-child(4){animation-delay:.24s}.hero-content > *:nth-child(5){animation-delay:.32s}
@keyframes rise{to{opacity:1;transform:none}}
.hero-kicker{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#fff;margin-bottom:18px}
.hero-kicker .mark{width:22px;height:30px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:900;font-size:18px;letter-spacing:0;clip-path:polygon(0 0,100% 0,100% 100%,0 86%)}
.hero-title{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.hero-icon{width:clamp(56px,7vw,84px);height:clamp(56px,7vw,84px);border-radius:18px;flex:none;display:grid;place-items:center;font-size:clamp(30px,4vw,46px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden}
.hero-icon img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(38px,6.4vw,86px);line-height:.95;font-weight:900;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:15px;color:#e5e5e5;margin-bottom:14px}
.hero-meta .dot{width:4px;height:4px;border-radius:50%;background:#888}
.hero p{font-size:clamp(15px,1.45vw,19px);line-height:1.5;color:#eee;text-shadow:0 2px 12px rgba(0,0,0,.8);margin-bottom:24px;max-width:540px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 26px;border-radius:6px;font-weight:700;font-size:16px;transition:transform .15s,background .2s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
.btn-play{background:#fff;color:#000}
.btn-play:hover{background:rgba(255,255,255,.82)}
.btn-ghost{background:rgba(109,109,110,.62);color:#fff}
.btn-ghost:hover{background:rgba(109,109,110,.42)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent);filter:brightness(1.08)}
.btn-line{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-line:hover{background:var(--panel-2)}
.btn-danger{background:#2a0b0b;color:#ff6b6b;border:1px solid #5a1515}
.btn-danger:hover{background:#3a0e0e}
.btn-sm{height:38px;padding:0 16px;font-size:14px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.round-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.55);color:#fff;background:rgba(30,30,30,.55);transition:all .2s}
.round-btn:hover{border-color:#fff;background:rgba(60,60,60,.7);transform:scale(1.06)}
.round-btn.on{color:var(--accent);border-color:var(--accent)}
.round-btn svg{width:22px;height:22px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1;white-space:nowrap;color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.badge.s-available{color:#3ee08f;border-color:rgba(62,224,143,.4)}
.badge.s-new{color:#fff;background:var(--accent);border-color:transparent}
.badge.s-new::before{background:#fff;animation:blink 1.4s infinite}
.badge.s-coming{color:#ffc247;border-color:rgba(255,194,71,.4)}
.badge.s-dev{color:#5ab0ff;border-color:rgba(90,176,255,.4)}
.badge.s-updated{color:#c58bff;border-color:rgba(197,139,255,.45)}
@keyframes blink{50%{opacity:.25}}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg-2)}

/* ============ ROWS ============ */
main{position:relative;z-index:2}
.rows{position:relative;margin-top:-110px;padding-bottom:60px;z-index:3}
.rows.no-hero{margin-top:0;padding-top:calc(var(--nav-h) + 30px)}
.row{position:relative;margin-bottom:22px}
.row-head{display:flex;align-items:baseline;gap:14px;padding:0 var(--pad);margin-bottom:-22px;position:relative;z-index:2}
.row-head h2{font-size:clamp(17px,1.6vw,23px);font-weight:700;letter-spacing:.005em;color:var(--fg)}
.row-head .explore{font-size:13px;font-weight:600;color:var(--accent-2);opacity:0;transform:translateX(-8px);transition:all .3s;display:inline-flex;align-items:center;gap:4px}
.row:hover .row-head .explore{opacity:1;transform:none}
.row-head .count{font-size:13px;color:var(--muted)}
.track-wrap{position:relative}
.track{--cols:5.4;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);padding:44px var(--pad);scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track .card{flex:0 0 calc((100vw - 2*var(--pad) - (var(--cols) - 1)*10px)/var(--cols));scroll-snap-align:start}
.arrow{position:absolute;top:44px;bottom:44px;width:calc(var(--pad) - 4px);min-width:34px;z-index:20;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s,background .2s}
.arrow svg{width:34px;height:34px;transition:transform .2s}
.arrow:hover{background:rgba(0,0,0,.72)}
.arrow:hover svg{transform:scale(1.25)}
.arrow.l{left:0;border-radius:0 6px 6px 0}.arrow.r{right:0;border-radius:6px 0 0 6px}
.track-wrap:hover .arrow:not(.hide){opacity:1}
.arrow.hide{opacity:0!important;pointer-events:none}
.row-empty{padding:30px var(--pad) 10px;color:var(--muted);font-size:14px}

/* ============ CARDS ============ */
.card{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;cursor:pointer;background:#111;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .38s cubic-bezier(.2,.7,.2,1),box-shadow .38s,z-index 0s .38s;transform-origin:center;isolation:isolate;outline-offset:3px}
.card .art{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .4s}
.card .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.25) 45%,transparent 70%);transition:background .35s}
.card .c-top{transition:opacity .25s;position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .c-top .badge{font-size:9.5px;padding:4px 7px}
.card .mini-fav{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--accent-2);background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.card .mini-fav svg{width:14px;height:14px}
.card .c-title{position:absolute;left:12px;right:12px;bottom:11px;display:flex;align-items:center;gap:10px;color:#fff;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.card .c-ico{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);overflow:hidden}
.card .c-ico img{width:100%;height:100%;object-fit:cover}
.card .c-name{font-weight:800;font-size:clamp(14px,1.1vw,17px);line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .c-hover{position:absolute;left:0;right:0;bottom:0;padding:0 12px 12px;color:#fff;opacity:0;transform:translateY(12px);transition:all .35s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.card .c-hname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;line-height:1.15}
.card .c-hname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .c-hname .badge{font-size:9px;padding:3px 6px;flex:none}
.card .c-desc{font-size:12px;line-height:1.4;color:#ddd;margin:5px 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c-actions{display:flex;gap:7px;align-items:center}
.card .c-actions button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.55);background:rgba(20,20,20,.6);color:#fff;transition:all .2s}
.card .c-actions button:hover{border-color:#fff;background:rgba(70,70,70,.8);transform:scale(1.08)}
.card .c-actions button.play{background:#fff;color:#000;border-color:#fff}
.card .c-actions button.play:hover{background:#ddd}
.card .c-actions button.on{color:var(--accent-2);border-color:var(--accent-2)}
.card .c-actions button svg{width:15px;height:15px}
.card .c-actions .cat{margin-left:auto;font-size:11px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.card .glow{position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:box-shadow .35s}
@media (hover:hover){
  .card:hover,.card:focus-visible{transform:scale(1.13);z-index:10;transition:transform .38s cubic-bezier(.2,.7,.2,1),box-shadow .38s,z-index 0s;box-shadow:0 22px 50px rgba(0,0,0,.7),0 0 34px -4px color-mix(in srgb,var(--glow,var(--accent)) 70%,transparent)}
  .card:hover .art{transform:scale(1.06);filter:brightness(.8)}
  .card:hover .shade{background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.05) 100%)}
  .card:hover .c-title{opacity:0;transform:translateY(-10px)}
  .card:hover .c-top{opacity:0}
  .card:hover .c-hover{opacity:1;transform:none;pointer-events:auto}
  .card:hover .glow{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--glow,var(--accent)) 70%,transparent)}
  .track .card:first-child:hover{transform-origin:left center}
  .track .card:last-child:hover{transform-origin:right center}
}
.card.dim{filter:grayscale(.35)}
.card.dim .art{filter:brightness(.7) grayscale(.3)}

/* grid pages */
.page-head{padding:0 var(--pad) 8px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px}
.page-head h1{font-size:clamp(30px,4.4vw,54px);font-weight:900;letter-spacing:-.02em}
.page-head p{color:var(--muted);font-size:15px;margin-top:6px}
.page-head .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 12px;padding:30px var(--pad) 40px}
.empty{padding:70px var(--pad);text-align:center;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:12px}
.empty h3{color:var(--fg);font-size:22px;margin-bottom:8px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* footer */
footer{position:relative;z-index:2;padding:40px var(--pad) 60px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;border-top:1px solid var(--line)}
footer img{height:16px;opacity:.85}
footer button{color:var(--muted);font-size:13px}
footer button:hover{color:var(--fg);text-decoration:underline}

/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px;opacity:0;transition:opacity .3s}
.overlay.show{opacity:1}
.modal{position:relative;width:min(880px,100%);background:var(--panel);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.7);overflow:hidden;transform:translateY(30px) scale(.96);transition:transform .4s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);margin:auto 0}
.overlay.show .modal{transform:none}
.modal.sm{width:min(460px,100%)}
.modal.md{width:min(720px,100%)}
.x-btn{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,10,.75);color:#fff;transition:background .2s,transform .2s}
.x-btn:hover{background:#000;transform:rotate(90deg)}
.d-hero{position:relative;aspect-ratio:16/8;background-size:cover;background-position:center}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--panel) 0%,transparent 55%),linear-gradient(90deg,rgba(0,0,0,.55),transparent 60%)}
.d-hero-in{position:absolute;left:36px;right:36px;bottom:26px;z-index:2;color:#fff}
.d-hero-in .hero-title{margin-bottom:18px}
.d-hero-in h2{font-size:clamp(28px,4vw,46px);font-weight:900;line-height:1;letter-spacing:-.02em;text-shadow:0 3px 20px rgba(0,0,0,.6)}
:root.light .d-hero-in{color:#fff}
.d-body{display:grid;grid-template-columns:1.6fr 1fr;gap:34px;padding:8px 36px 36px}
.d-body p.desc{font-size:16px;line-height:1.65;color:var(--fg-2)}
.d-body h4{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:600}
.d-body ul.feat{list-style:none;display:grid;gap:9px}
.d-body ul.feat li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--fg-2)}
.d-body ul.feat li svg{color:var(--accent);margin-top:3px}
.d-side{font-size:14px;color:var(--muted);display:grid;gap:12px;align-content:start}
.d-side b{color:var(--fg);font-weight:500}
.d-side .tags{display:flex;flex-wrap:wrap;gap:6px}
.d-side .url{word-break:break-all;color:var(--fg-2)}
.d-more{padding:0 36px 36px}
.d-more .grid{padding:16px 0 0;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

/* forms / panels */
.m-head{padding:24px 28px 0;display:flex;align-items:center;gap:14px}
.m-head h2{font-size:24px;font-weight:800}
.m-body{padding:22px 28px 28px}
.m-foot{padding:16px 28px 24px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.field{display:grid;gap:7px;margin-bottom:16px}
.field label,.lbl{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;outline:0;transition:border-color .2s,box-shadow .2s;color:var(--fg)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.f-grid .full{grid-column:1/-1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .t-txt b{display:block;font-weight:600;font-size:15px}
.toggle .t-txt span{font-size:13px;color:var(--muted)}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:#444;transition:background .25s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,.8,.3,1.3);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{padding:7px 14px;border-radius:6px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);transition:transform .2s}
.swatch:hover{transform:scale(1.12)}
.swatch.on{border-color:var(--fg)}
input[type=color].color{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg-2);padding:2px;cursor:pointer}
.sect{margin-bottom:26px}
.sect > h3{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px;font-weight:700}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.hint{font-size:13px;color:var(--muted);line-height:1.5}

/* manage drawer */
.drawer-ov{align-items:stretch;justify-content:flex-end;padding:0}
.drawer{width:min(760px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;transform:translateX(40px);opacity:.6;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s;border-left:1px solid var(--line)}
.overlay.show .drawer{transform:none;opacity:1}
.drawer .m-head{padding-top:max(24px,env(safe-area-inset-top))}
.tabs{display:flex;gap:4px;padding:16px 28px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:12px 14px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.drawer-body{flex:1;overflow-y:auto;padding:20px 28px 40px}
.m-list{list-style:none;display:grid;gap:8px}
.m-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);transition:background .2s,border-color .2s,transform .2s,opacity .2s}
.m-item.dragging{opacity:.4}
.m-item.over-top{box-shadow:0 -3px 0 var(--accent)}
.m-item.over-bot{box-shadow:0 3px 0 var(--accent)}
.m-item .grip{cursor:grab;color:var(--muted);padding:4px;touch-action:none}
.m-item .thumb{width:76px;aspect-ratio:16/9;border-radius:6px;background-size:cover;background-position:center;flex:none}
.m-item .meta{flex:1;min-width:0}
.m-item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.m-item .meta span{font-size:12.5px;color:var(--muted)}
.m-item .acts{display:flex;gap:2px;align-items:center}
.m-item .acts button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2)}
.m-item .acts button:hover{background:var(--panel-2);color:var(--fg)}
.m-item .acts button.on{color:#ffc247}
.m-item .acts button.del:hover{color:#ff5b5b}
.m-item .acts svg{width:17px;height:17px}
.m-item input.inp{padding:8px 10px;font-size:14px}
.m-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.m-toolbar .inp{flex:1;min-width:160px}
.hero-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.hero-pick .card{cursor:pointer}
.hero-pick .card.sel{box-shadow:0 0 0 3px var(--accent),0 10px 30px rgba(0,0,0,.4)}
.hero-pick .card.sel::after{content:"HERO";position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.15em;padding:4px 7px;border-radius:4px}

/* app editor */
.ed-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:26px}
.ed-preview{position:sticky;top:0;align-self:start}
.ed-preview .card{width:100%;transform:none!important}
.style-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.style-pick button{aspect-ratio:16/10;border-radius:7px;background-size:cover;background-position:center;border:2px solid transparent;position:relative;overflow:hidden}
.style-pick button span{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;padding:2px 0;text-align:center}
.style-pick button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upl .file{position:relative;overflow:hidden}
.upl .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emoji-row button{width:34px;height:34px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-size:18px}
.emoji-row button:hover{border-color:var(--accent)}
.icon-prev{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;flex:none}
.icon-prev img{width:100%;height:100%;object-fit:cover}

/* in-app player */
.player{position:fixed;inset:0;z-index:800;background:#000;display:flex;flex-direction:column;opacity:0;transform:scale(1.04);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.player.show{opacity:1;transform:none;pointer-events:auto}
.p-bar{flex:none;height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:linear-gradient(180deg,#141414,#0b0b0b);border-bottom:1px solid rgba(255,255,255,.08);color:#fff;transition:margin-top .35s cubic-bezier(.2,.8,.2,1)}
.p-bar .p-back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 8px;border-radius:8px;font-weight:600;font-size:14px}
.p-bar .p-back:hover,.p-bar .p-btn:hover{background:rgba(255,255,255,.1)}
.p-bar .p-back img{height:15px;margin-left:4px}
.p-bar .p-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1;justify-content:center;font-weight:700;font-size:15px}
.p-bar .p-title .c-ico{width:28px;height:28px;border-radius:7px;overflow:hidden;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.1);flex:none}
.p-bar .p-title .c-ico img{width:100%;height:100%;object-fit:cover}
.p-bar .p-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-bar .p-btn{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:#ddd}
.p-bar .p-btn svg{width:19px;height:19px}
.p-bar .p-btn.on{color:var(--accent-2)}
.p-stage{position:relative;flex:1;background:#000}
.p-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .5s}
.p-stage iframe.ready{opacity:1}
.p-load{position:absolute;inset:0;display:grid;place-items:center;background-size:cover;background-position:center;transition:opacity .6s;z-index:2}
.p-load::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.p-load.gone{opacity:0;pointer-events:none}
.p-load-in{position:relative;display:grid;justify-items:center;gap:18px;color:#fff;text-align:center;padding:20px}
.p-load .c-ico{width:84px;height:84px;border-radius:20px;overflow:hidden;display:grid;place-items:center;font-size:44px;background:rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(255,255,255,.15),0 20px 60px rgba(0,0,0,.6),0 0 60px -10px var(--glow,var(--accent))}
.p-load .c-ico img{width:100%;height:100%;object-fit:cover}
.p-load h3{font-size:22px;font-weight:800}
.p-load .bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.p-load .bar::after{content:"";display:block;width:40%;height:100%;background:var(--accent);border-radius:3px;box-shadow:0 0 12px var(--accent);animation:pbar 1.1s ease-in-out infinite}
@keyframes pbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.p-load .hint{color:#bbb;max-width:380px}
.p-load .hint.late{opacity:0;animation:fadeIn .5s 6s forwards}
.player.immersive .p-bar{margin-top:-53px}
.p-peek{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;display:none;padding:4px 14px;border-radius:0 0 10px 10px;background:rgba(20,20,20,.85);color:#fff;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.15);border-top:0}
.player.immersive .p-peek{display:block}
@media (max-width:640px){.p-bar .p-back span,.p-bar .p-back img,#pFav{display:none}.p-bar{gap:2px}.p-bar .p-title{justify-content:flex-start}.p-bar .p-btn.hide-sm{display:none}}

/* admin gating */
body:not(.admin) .admin-only{display:none!important}
body.admin .visitor-only{display:none!important}
.avatar{position:relative}
.avatar .adm-dot{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:#16a34a;border:2px solid #000;display:none;place-items:center}
.avatar .adm-dot svg{width:9px;height:9px;stroke:#fff;stroke-width:3}
body.admin .avatar .adm-dot{display:grid}
.admin-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:150;display:none;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:99px;background:rgba(20,20,20,.92);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
body.admin .admin-bar{display:flex}
.admin-bar .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
.admin-bar button{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:600}
.admin-bar button:hover{background:rgba(255,255,255,.2)}
.lock-ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-2);margin-bottom:4px}
.lock-ico svg{width:28px;height:28px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:6px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:900;display:grid;gap:10px;justify-items:center;pointer-events:none;width:min(520px,92vw)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:rgba(22,22,22,.96);color:#fff;border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--accent);padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:14px;animation:toastIn .4s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(8px)}
.toast button{color:var(--accent-2);font-weight:700;font-size:13px;padding:4px 6px;white-space:nowrap}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* launch flash */
.launch-fx{position:fixed;inset:0;z-index:950;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(229,9,20,.35),rgba(0,0,0,.92) 70%);animation:launchFx 1.05s ease forwards}
.launch-fx .ring{width:120px;height:120px;border-radius:50%;border:3px solid var(--accent);box-shadow:0 0 40px var(--accent);animation:ring 1s ease-out forwards}
.launch-fx .lbl{position:absolute;top:calc(50% + 86px);color:#fff;font-size:15px;letter-spacing:.3em;text-transform:uppercase;font-weight:700}
@keyframes launchFx{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0}}

/* ============ RESPONSIVE ============ */
@media (max-width:1400px){.track{--cols:4.4}}
@media (max-width:1180px){
  .nav{gap:18px}.nav-links{gap:14px}.nav-links button{font-size:13px}
}
@media (max-width:1024px){
  .track{--cols:3.3}
  .nav-links{display:none}
  .menu-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:600;font-size:14px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
  .d-body{grid-template-columns:1fr}
  .ed-grid{grid-template-columns:1fr}
  .ed-preview{position:relative;order:-1}
}
@media (max-width:640px){
  :root{--pad:16px;--nav-h:60px}
  .track{--cols:1.65;gap:10px}
  .brand img{height:19px}
  .nav{gap:10px}
  .nav-right{gap:4px}
  .search-wrap.open{position:absolute;left:12px;right:12px;width:auto;z-index:5}
  .search-wrap kbd{display:none!important}
  .hero{height:80vh;min-height:520px;padding-bottom:110px;align-items:flex-end}
  .hero::after{background:linear-gradient(0deg,var(--bg) 2%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.6) 100%)}
  .hero-kicker{font-size:11px;letter-spacing:.24em}
  .hero-actions .btn{flex:1;height:50px;padding:0 14px}
  .hero-actions{width:100%;flex-wrap:nowrap;gap:8px}
  .hero-actions .round-btn{flex:none}
  .rows{margin-top:-80px}
  .arrow{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .grid .card .c-name{font-size:13px}
  .grid .card .c-ico{width:26px;height:26px;font-size:15px;border-radius:7px}
  .d-hero{aspect-ratio:4/3}
  .d-hero-in{left:20px;right:20px}
  .d-body,.d-more{padding-left:20px;padding-right:20px}
  .m-head,.m-body,.m-foot{padding-left:18px;padding-right:18px}
  .tabs{padding:12px 12px 0}.drawer-body{padding:16px 14px 40px}
  .f-grid{grid-template-columns:1fr}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100%}
  .m-item .thumb{width:58px}
  .m-item .acts button{width:32px}
  .m-item .acts .up,.m-item .acts .down{display:none}
  .card .c-actions button{width:38px;height:38px}
  .row-head .explore{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e) {}
  if (!raw) { const d = seedData(); return d; }
  try {
    const d = JSON.parse(raw);
    return migrate(d);
  } catch(e) {
    console.warn('LASTEAST: could not parse saved data, keeping a backup copy.', e);
    try { localStorage.setItem(KEY + ':corrupt:' + Date.now(), raw); } catch(_){}
    return seedData();
  }
}
// Non-destructive migration: fills any missing fields, never removes user data.
function migrate(d) {
  d = d && typeof d === 'object' ? d : {};
  const from = d.schema || 1;
  if (from < 3 && Array.isArray(d.apps)) {
    // v3 content update: remove retired starter apps, refresh Fusion, add Pdf & Cut. User-created apps are kept.
    const seed = seedData();
    d.apps = d.apps.filter(a => a && !OLD_SEED_IDS.includes(a.id));
    const fus = d.apps.find(a => a.id === 'lasteast-fusion'), sf = seed.apps[0];
    if (fus) { if (!fus.art || fus.art.type !== 'image') fus.art = sf.art; if (!isImg(fus.icon)) fus.icon = sf.icon; fus.featured = true; }
    seed.apps.forEach(sa => { if (!d.apps.some(a => a.id === sa.id)) d.apps.push(sa); });
    d.recent = (d.recent || []).filter(id => !OLD_SEED_IDS.includes(id));
    if (d.settings && OLD_SEED_IDS.includes(d.settings.heroId)) d.settings.heroId = 'lasteast-fusion';
  }
  if (from < 4 && Array.isArray(d.apps)) {
    // v4: Lasteast Fusion is live
    const fus = d.apps.find(a => a && a.id === 'lasteast-fusion');
    if (fus && !fus.url) { fus.url = 'https://lasteast-fusion.netlify.app/app/'; if (fus.status === 'dev' || fus.status === 'coming') fus.status = 'available'; }
  }
  if (from < 5 && Array.isArray(d.apps)) {
    // v5: add Lasteast Present, Write and Matrix
    seedData().apps.filter(sa => ['lasteast-present','lasteast-write','lasteast-matrix'].includes(sa.id))
      .forEach(sa => { if (!d.apps.some(a => a && a.id === sa.id)) d.apps.push(sa); });
  }
  if (from < 6 && Array.isArray(d.apps)) {
    // v6: Present, Write and Matrix belong to Education
    if (Array.isArray(d.categories) && !d.categories.some(c => c && c.id === 'education')) d.categories.unshift(seedData().categories[0]);
    d.apps.forEach(a => { if (a && ['lasteast-present','lasteast-write','lasteast-matrix'].includes(a.id)) a.category = 'education'; });
  }
  if (from < 7 && Array.isArray(d.apps)) {
    // v7: Lasteast Fusion is now Lasteast Model (new name, link and artwork); keeps its place, favorite and featured state
    const sm = seedData().apps.find(a => a.id === 'lasteast-model');
    const fi = d.apps.findIndex(a => a && a.id === 'lasteast-fusion');
    const old = d.apps.find(a => a && a.id === 'lasteast-model');
    if (fi >= 0) {

        <circle cx="-36" cy="-6" r="4" fill="#fff"/><circle cx="44" cy="-6" r="4" fill="#fff"/>
        <ellipse cx="-70" cy="24" rx="18" ry="9" fill="#ff5fa2" opacity=".5"/><ellipse cx="70" cy="24" rx="18" ry="9" fill="#ff5fa2" opacity=".5"/>
        <path d="M-14 22 Q-7 32 0 22 Q7 32 14 22" stroke="#3b2433" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M-50 -95 Q-40 -125 -20 -100" stroke="#7ed957" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;
      break;
    }
    case 'synth': {
      defs = `<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c2,-.7)}"/><stop offset=".6" stop-color="${shade(c1,-.3)}"/></linearGradient>
        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="${c1}"/></linearGradient>`;
      body = `<rect width="${W}" height="${H}" fill="url(#sky)"/><circle cx="440" cy="190" r="110" fill="url(#sun)"/>`;
      for (let i=0;i<6;i++) body += `<rect x="320" y="${170+i*16}" width="240" height="${3+i*1.4}" fill="${shade(c1,-.3)}"/>`;
      body += `<rect y="210" width="${W}" height="150" fill="${shade(c2,-.85)}"/>`;
      for (let i=0;i<14;i++) { const y = 210 + Math.pow(i/13,2)*150; body += `<path d="M0 ${y}H${W}" stroke="${c2}" stroke-opacity=".8"/>`; }
      for (let i=-12;i<=12;i++) body += `<path d="M${440+i*12} 210 L${440+i*90} 360" stroke="${c2}" stroke-opacity=".8"/>`;
      break;
    }
    case 'waves': {
      defs = `<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${d2}"/><stop offset="1" stop-color="${shade(c2,-.5)}"/></linearGradient>`;
      body = `<rect width="${W}" height="${H}" fill="url(#g)"/>`;
      for (let k=0;k<14;k++) {
        const amp = rnd(14,40), ph = rnd(0,6), y0 = 70 + k*18; let d = `M0 ${y0}`;
        for (let x=0;x<=W;x+=16) d += ` L${x} ${(y0 + Math.sin(x/70 + ph + k*.3)*amp).toFixed(1)}`;
        body += `<path d="${d}" fill="none" stroke="${k%2?c1:c2}" stroke-opacity="${.25+k*.04}" stroke-width="${1.5+k*.12}"/>`;
      }

    }
    case 'bokeh': {

        <radialGradient id="b2" r=".5"><stop offset="0" stop-color="${c2}" stop-opacity=".8"/><stop offset="1" stop-color="${c2}" stop-opacity="0"/></radialGradient>`;
      body = `<rect width="${W}" height="${H}" fill="${shade(c1,-.88)}"/>`;
      for (let i=0;i<34;i++) { const r = rnd(14,80); body += `<circle cx="${rnd(0,W)}" cy="${rnd(0,H)}" r="${r}" fill="url(#b${i%2?1:2})" opacity="${rnd(.3,.9)}"/>`; }
      break;

    case 'circuit': {

        for (let j=0;j<4;j++) { if (R()>.5) x += Math.round(rnd(-4,4))*20; else y += Math.round(rnd(-3,3))*20; d += ` L${x} ${y}`; }
        body += `<path d="${d}" fill="none" stroke="${c1}" stroke-opacity="${rnd(.3,.8)}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="4" fill="${l1}"/>`;
      }
      body += `<rect x="410" y="110" width="130" height="130" rx="14" fill="${shade(c2,-.6)}" stroke="${c1}" stroke-width="3"/><rect x="440" y="140" width="70" height="70" rx="8" fill="${c1}" opacity=".85"/>`;

      defs = `<radialGradient id="a" cx=".8" cy=".2" r=".9"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/></radialGradient>
        <radialGradient id="b" cx=".2" cy=".9" r=".8"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c2}" stop-opacity="0"/></radialGradient>`;
      body = `<rect width="${W}" height="${H}" fill="${shade(c1,-.85)}"/><rect width="${W}" height="${H}" fill="url(#a)"/><rect width="${W}" height="${H}" fill="url(#b)"/>`;
      for (let i=1;i<9;i++) body += `<circle cx="500" cy="170" r="${i*28}" fill="none" stroke="#fff" stroke-opacity="${.18-i*.017}"/>`;

const artCache = new Map();
function artURL(a) {
  const art = a.art || {};
  if (art.type === 'image' && art.image) return src(art.image);
  const k = [art.style, art.c1, art.c2, a.id].join('|');
  if (!artCache.has(k)) artCache.set(k, 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgArt(art.style || 'mesh', art.c1 || '#e50914', art.c2 || '#222', a.id)));
  return artCache.get(k);
}
const cssURL = u => `url('${String(u).replace(/'/g,'%27').replace(/"/g,'%22').replace(/\n/g,'')}')`;
const glowOf = a => (a.art && a.art.c1) || 'var(--accent)';
const iconHTML = a => (a.icon && isImg(a.icon)) ? `<img src="${esc(src(a.icon))}" alt="">` : esc(a.icon || '🚀');
const badge = s => `<span class="badge s-${esc(s)}">${esc(STATUS_LBL[s] || s)}</span>`;
const isReady = a => !(a.status === 'coming' || a.status === 'dev');

/* ======================= VIEW / ROUTING ======================= */

function heroApp() {

}

let lastHeroKey = '';
function heroHTML() {

  return `<section class="hero" id="hero">

      <div class="hero-meta">${badge(a.status)}<span>${esc(c?c.name:'')}</span>${a.tags.slice(0,3).map(t=>`<span class="dot"></span><span>${esc(t)}</span>`).join('')}</div>
      <p>${esc(a.description)}</p>

      </div>

}
function paintHero(prev) {
  const a = heroApp(); if (!a) return;
  const url = artURL(a);
  const b0 = $('#hb0'), b1 = $('#hb1'); if (!b0) return;
  b0.style.backgroundImage = cssURL(url);
  if (prev && prev !== url) {
    // crossfade from the previous hero artwork
    b1.style.transition = 'none'; b1.style.backgroundImage = cssURL(prev); b1.classList.add('show'); void b1.offsetWidth; b1.style.transition = '';
    requestAnimationFrame(() => { b0.classList.add('show'); b1.classList.remove('show'); });
  } else if (prev === url) {
    b0.style.transition = 'none'; b0.classList.add('show'); void b0.offsetWidth; b0.style.transition = '';
    $('.hero-content').classList.add('static');
  } else requestAnimationFrame(() => b0.classList.add('show'));
  lastHeroKey = url;
}

function rowHTML(id, title, list, opts={}) {
  if (!list.length && !opts.empty) return '';
  return `<section class="row reveal" data-row="${esc(id)}">
    <div class="row-head"><h2>${esc(title)}</h2>${list.length?`<span class="count">${list.length}</span>`:''}${opts.go?`<button class="explore" data-go="${esc(opts.go)}">Explore all ${I.chevR}</button>`:''}</div>
    ${list.length ? `<div class="track-wrap">
      <button class="arrow l hide" aria-label="Scroll left">${I.chevL}</button>
      <div class="track">${list.map(a => cardHTML(a)).join('')}</div>

}

function renderHome() {
  const recent = S.recent.map(app).filter(Boolean);
  const featured = S.apps.filter(a => a.featured);
  const favs = S.apps.filter(a => a.fav);
  const soon = S.apps.filter(a => a.status === 'coming' || a.status === 'dev');
  let rows = '';
  rows += rowHTML('recent', 'Continue Exploring', recent, {empty: S.settings.showEmptyRows ? 'Apps you launch will appear here.' : ''});
  rows += rowHTML('featured', 'Featured Projects', featured, {go:'all'});
  S.categories.forEach(c => rows += rowHTML('cat-'+c.id, c.name, S.apps.filter(a => a.category === c.id), {go:'cat:'+c.id, empty: S.settings.showEmptyRows ? 'No apps here yet.' : ''}));
  rows += rowHTML('favs', 'My Favorites', favs, {go:'favs', empty:'Tap the ♥ on any app to add it to your favorites.'});

  if (!S.apps.length) rows = emptyHTML('🎬','Your platform is empty','Add your first application and it will appear here like a featured title.', true);

}
function emptyHTML(icon, h, p, add) {
  return `<div class="empty"><div class="big">${icon}</div><h3>${esc(h)}</h3><p>${esc(p)}</p>${add?`<p class="admin-only" style="margin-top:20px"><button class="btn btn-accent" data-act="add">${I.plus} Add Application</button></p>`:''}</div>`;
}
function gridPage(title, sub, list, extra='') {
  return `<div class="rows no-hero"><div class="page-head reveal"><div><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div><div class="spacer"></div>${extra}</div>
    ${list.length ? `<div class="grid">${list.map(a => cardHTML(a)).join('')}</div>` : emptyHTML('🗂️','Nothing here yet', title==='Favorites' ? 'Tap the ♥ on any app to save it here.' : 'Add an application to this section to see it here.', title!=='Favorites')}</div>`;
}
function searchResults(q) {
  const t = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return S.apps.map(a => {
    const c = cat(a.category);
    const hay = {name:a.name.toLowerCase(), desc:a.description.toLowerCase(), cat:(c?c.name+' '+c.nav:'').toLowerCase(), tags:a.tags.join(' ').toLowerCase(), st:(STATUS_LBL[a.status]||'').toLowerCase(), feat:a.features.join(' ').toLowerCase()};
    let score = 0;
    for (const w of t) {
      let s = 0;
      if (hay.name.includes(w)) s += hay.name.startsWith(w) ? 10 : 6;
      if (hay.tags.includes(w)) s += 4;
      if (hay.cat.includes(w)) s += 3;
      if (hay.st.includes(w)) s += 2;
      if (hay.desc.includes(w)) s += 2;
      if (hay.feat.includes(w)) s += 1;
      if (!s) return null;
      score += s;
    }
    return {a, score};
  }).filter(Boolean).sort((x,y) => y.score - x.score).map(x => x.a);
}

function render() {
  renderNav();
  const m = $('#main');
  let html = '';
  if (searchQ.trim()) {
    const res = searchResults(searchQ);
    html = `<div class="rows no-hero"><div class="page-head"><div><h1 style="font-size:clamp(22px,3vw,34px)">Results for “${esc(searchQ.trim())}”</h1><p>${res.length} ${res.length===1?'application':'applications'} found</p></div></div>
      ${res.length ? `<div class="grid">${res.map(a => cardHTML(a)).join('')}</div>` : emptyHTML('🔍','No matches','Try a different name, category or tag.')}</div>`;
  } else if (view.name === 'home') html = renderHome();
  else if (view.name === 'all') html = gridPage('My Apps', `All ${S.apps.length} applications on your platform`, S.apps, `<span class="admin-only" style="display:flex;gap:10px"><button class="btn btn-accent btn-sm" data-act="add">${I.plus} Add</button><button class="btn btn-line btn-sm" data-act="manage">Manage</button></span>`);
  else if (view.name === 'favs') html = gridPage('Favorites', 'Your saved applications', S.apps.filter(a => a.fav));
  else if (view.name === 'cat') {
    const c = cat(view.arg);
    if (!c) { view = {name:'home'}; return render(); }
    html = gridPage(c.name, c.desc, S.apps.filter(a => a.category === c.id), `<button class="btn btn-accent btn-sm admin-only" data-act="add" data-cat="${esc(c.id)}">${I.plus} Add to ${esc(c.nav||c.name)}</button>`);
  }
  const prevHero = lastHeroKey;
  m.innerHTML = html;
  if ($('#hero')) paintHero(prevHero); else lastHeroKey = '';

/* ======================= ROWS: arrows & reveal ======================= */
function setupRows() {
  $$('.track-wrap').forEach(w => {
    const t = $('.track', w), l = $('.arrow.l', w), r = $('.arrow.r', w);
    const upd = () => { l.classList.toggle('hide', t.scrollLeft < 8); r.classList.toggle('hide', t.scrollLeft + t.clientWidth >= t.scrollWidth - 8); };
    l.onclick = () => t.scrollBy({left: -t.clientWidth * .85, behavior:'smooth'});
    r.onclick = () => t.scrollBy({left: t.clientWidth * .85, behavior:'smooth'});
    t.addEventListener('scroll', upd, {passive:true}); upd();
    new ResizeObserver(upd).observe(t);
  });
}
let io;
function observeReveal() {
  if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -6% 0px'});
  $$('.reveal:not(.in)').forEach(el => io.observe(el));
}

/* ======================= ACTIONS ======================= */
function launch(a) {
  if (!a) return;
  if (!isReady(a)) { toast(`${a.name} is ${STATUS_LBL[a.status].toLowerCase()} — stay tuned.`); return; }
  if (!a.url) { toast(`No link set for ${a.name} yet.`); return; }
  S.recent = [a.id, ...S.recent.filter(x => x !== a.id)].slice(0, 15); save();
  if (S.settings.openInside !== false && !a.newTab) { openPlayer(a); return; }
  const w = window.open(a.url, '_blank', 'noopener');
  const fx = document.createElement('div'); fx.className = 'launch-fx'; fx.innerHTML = `<div class="ring"></div><div class="lbl">Launching ${esc(a.name)}</div>`;
  document.body.appendChild(fx); setTimeout(() => fx.remove(), 1100);
  if (!w) toast('Your browser blocked the new tab.', 'Open here', () => { location.href = a.url; });
  setTimeout(() => { if (view.name === 'home' && !searchQ) refreshRowsKeepScroll(); }, 900);
}
/* ---------- in-app player ---------- */
let playerApp = null;
function openPlayer(a, fromHistory) {
  const pl = $('#player'), stage = $('#pStage');
  playerApp = a;
  $$('iframe, .p-load', stage).forEach(x => x.remove());
  stack.slice().forEach(s => closeModal(s.ov));
  closeMenus();
  pl.style.setProperty('--glow', glowOf(a));
  $('#pTitle').innerHTML = `<span class="c-ico">${iconHTML(a)}</span><span>${esc(a.name)}</span>`;
  paintPlayerFav();
  const load = document.createElement('div'); load.className = 'p-load';
  load.style.backgroundImage = cssURL(artURL(a));
  load.innerHTML = `<div class="p-load-in"><span class="c-ico">${iconHTML(a)}</span><h3>Launching ${esc(a.name)}</h3><div class="bar"></div>
    <p class="hint late">Taking a while? Some websites don't allow being shown inside other sites.<br><button class="btn btn-ghost btn-sm" style="margin-top:12px" data-pext>Open in a new tab instead</button></p></div>`;
  const fr = document.createElement('iframe');
  fr.title = a.name;
  fr.allow = 'fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone; display-capture; geolocation; xr-spatial-tracking; web-share';
  fr.allowFullscreen = true;
  fr.referrerPolicy = 'strict-origin-when-cross-origin';
  fr.addEventListener('load', () => { fr.classList.add('ready'); load.classList.add('gone'); setTimeout(() => load.remove(), 700); });
  fr.src = a.url;
  stage.append(fr, load);
  pl.classList.remove('immersive');
  pl.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(() => pl.classList.add('show'));
  document.body.classList.add('locked');
  if (!fromHistory) { try { history.pushState({lePlayer: a.id}, '', '#play=' + encodeURIComponent(a.id)); } catch(_){} }
}
function closePlayer(fromHistory) {
  const pl = $('#player'); if (!playerApp) return;
  if (!fromHistory && history.state && history.state.lePlayer) { history.back(); return; } // popstate will call us again
  playerApp = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  pl.classList.remove('show'); pl.setAttribute('aria-hidden', 'true');
  setTimeout(() => { if (!playerApp) $$('#pStage iframe, #pStage .p-load').forEach(x => x.remove()); }, 400);
  document.body.classList.toggle('locked', stack.length > 0);
  if (!fromHistory && location.hash.startsWith('#play=')) { try { history.replaceState(null, '', location.pathname + location.search); } catch(_){} }
  if (view.name === 'home' && !searchQ) refreshRowsKeepScroll();
}
function paintPlayerFav() { const b = $('#pFav'); if (!playerApp) return; b.innerHTML = playerApp.fav ? I.heartF : I.heart; b.classList.toggle('on', !!playerApp.fav); }
$('#pBack').onclick = () => closePlayer();
$('#pClose').onclick = () => closePlayer();
$('#pReload').onclick = () => { if (playerApp) openPlayer(playerApp, true); };
$('#pFav').onclick = () => { if (playerApp) { playerApp.fav = !playerApp.fav; save(); paintPlayerFav(); toast(playerApp.fav ? `Added ${playerApp.name} to Favorites` : `Removed ${playerApp.name} from Favorites`); } };
$('#pImm').onclick = () => $('#player').classList.add('immersive');
$('#pPeek').onclick = () => $('#player').classList.remove('immersive');
const extOpen = () => { if (playerApp) window.open(playerApp.url, '_blank', 'noopener'); };
$('#pExt').onclick = extOpen;
$('#player').addEventListener('click', e => { if (e.target.closest('[data-pext]')) extOpen(); });
window.addEventListener('popstate', e => {
  const id = e.state && e.state.lePlayer;
  if (id && app(id)) openPlayer(app(id), true);
  else if (playerApp) closePlayer(true);
});

function toggleFav(a) {
  a.fav = !a.fav; save();
  toast(a.fav ? `Added ${a.name} to Favorites` : `Removed ${a.name} from Favorites`);
  refreshRowsKeepScroll();
  if (detailsOpenId === a.id) openDetails(a.id, true);
}
function refreshRowsKeepScroll() {
  const pos = {}; $$('.row').forEach(r => { const t = $('.track', r); if (t) pos[r.dataset.row] = t.scrollLeft; });
  const y = window.scrollY;
  render();
  $$('.row').forEach(r => { const t = $('.track', r); if (t && pos[r.dataset.row] != null) { t.style.scrollBehavior = 'auto'; t.scrollLeft = pos[r.dataset.row]; t.style.scrollBehavior = ''; } r.classList.add('in'); });

/* ======================= MODALS ======================= */
const stack = [];
function openModal(html, cls='', opts={}) {
  const ov = document.createElement('div');
  ov.className = 'overlay ' + (opts.drawer ? 'drawer-ov' : '');
  ov.innerHTML = opts.drawer ? `<div class="drawer ${cls}" role="dialog" aria-modal="true">${html}</div>` : `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  document.body.classList.add('locked');
  requestAnimationFrame(() => ov.classList.add('show'));
  ov.addEventListener('mousedown', e => { if (e.target === ov && !opts.sticky) closeModal(ov); });
  const entry = {ov, onClose: opts.onClose};
  stack.push(entry);
  setTimeout(() => { const f = ov.querySelector('[autofocus]'); if (f) f.focus(); }, 60);
  return ov;
}
function closeModal(ov) {
  const i = stack.findIndex(s => s.ov === ov); if (i < 0) return;
  const [e] = stack.splice(i, 1);
  ov.classList.remove('show');
  setTimeout(() => ov.remove(), 300);
  if (!stack.length) document.body.classList.remove('locked');
  if (e.onClose) e.onClose();
}
const closeTop = () => stack.length && closeModal(stack[stack.length-1].ov);

function confirmBox(title, msg, okLabel='Delete', danger=true) {
  return new Promise(res => {
    let done = false;
    const ov = openModal(`<div class="m-head"><h2>${esc(title)}</h2></div><div class="m-body"><p class="hint" style="font-size:15px">${msg}</p></div>
      <div class="m-foot"><button class="btn btn-line btn-sm" data-r="0">Cancel</button><button class="btn ${danger?'btn-danger':'btn-accent'} btn-sm" data-r="1" autofocus>${esc(okLabel)}</button></div>`, 'sm', {onClose: () => { if (!done) res(false); }});
    ov.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b) return; done = true; res(b.dataset.r === '1'); closeModal(ov); });
  });
}

async function fileToDataURL(file, maxW, maxH, type='image/jpeg', q=.84) {
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  if (file.type === 'image/svg+xml' || file.type === 'image/gif') return url;
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, maxW / img.width, maxH / img.height);
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
  const cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL(type, q);
}

function setupDnD(root) {
  let dragId = null, list = null;
  const clear = () => $$('.over-top,.over-bot', root).forEach(x => x.classList.remove('over-top','over-bot'));
  root.addEventListener('dragstart', e => {
    const li = e.target.closest('.m-item[draggable="true"]'); if (!li) return;
    if (e.target.closest('input')) { e.preventDefault(); return; }
    dragId = li.dataset.id; list = li.parentElement.dataset.dnd; li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch(_){}
  });
  root.addEventListener('dragover', e => {
    const li = e.target.closest('.m-item'); if (!li || !dragId || li.parentElement.dataset.dnd !== list) return;
    e.preventDefault(); clear();
    const r = li.getBoundingClientRect(); li.classList.add(e.clientY < r.top + r.height/2 ? 'over-top' : 'over-bot');
  });
  root.addEventListener('drop', e => {
    const li = e.target.closest('.m-item'); if (!li || !dragId) return; e.preventDefault();
    const arr = list === 'cats' ? S.categories : S.apps;
    const from = arr.findIndex(x => x.id === dragId); if (from < 0) return;
    const before = li.classList.contains('over-top');
    const [x] = arr.splice(from, 1);
    let to = arr.findIndex(y => y.id === li.dataset.id); if (to < 0) { arr.splice(from, 0, x); return; }
    if (!before) to++;
    arr.splice(to, 0, x); save(); clear(); refreshManage(); render();
  });
  root.addEventListener('dragend', () => { dragId = null; clear(); $$('.dragging', root).forEach(x => x.classList.remove('dragging')); });
  // touch drag via grip
  let tItem = null;
  root.addEventListener('touchstart', e => { const g = e.target.closest('.grip'); if (!g) return; tItem = g.closest('.m-item'); tItem.classList.add('dragging'); }, {passive:true});
  root.addEventListener('touchmove', e => {
    if (!tItem) return; e.preventDefault();
    const tt = e.touches[0]; const el = document.elementFromPoint(tt.clientX, tt.clientY); const li = el && el.closest('.m-item');
    clear(); if (li && li !== tItem && li.parentElement === tItem.parentElement) { const r = li.getBoundingClientRect(); li.classList.add(tt.clientY < r.top + r.height/2 ? 'over-top' : 'over-bot'); }
  }, {passive:false});
  root.addEventListener('touchend', () => {
    if (!tItem) return;
    const target = $('.over-top,.over-bot', root);
    if (target) {
      const arr = tItem.parentElement.dataset.dnd === 'cats' ? S.categories : S.apps;
      const from = arr.findIndex(x => x.id === tItem.dataset.id); const [x] = arr.splice(from, 1);
      let to = arr.findIndex(y => y.id === target.dataset.id); if (target.classList.contains('over-bot')) to++;
      arr.splice(to, 0, x); save(); render();
    }
    tItem.classList.remove('dragging'); tItem = null; clear(); refreshManage();
  });
}

    // impact boom
    const hit = now + 1.55;
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(90, hit); o.frequency.exponentialRampToValueAtTime(34, hit + 1.8);
    const og = ac.createGain(); og.gain.setValueAtTime(0, hit); og.gain.linearRampToValueAtTime(.9, hit + .02); og.gain.exponentialRampToValueAtTime(.001, hit + 2.6);
    o.connect(og).connect(master); o.start(hit); o.stop(hit + 2.8);
    // chord swell
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(300, hit); lp.frequency.exponentialRampToValueAtTime(1800, hit + 1.2);
    const cg = ac.createGain(); cg.gain.setValueAtTime(0, hit); cg.gain.linearRampToValueAtTime(.16, hit + .25); cg.gain.exponentialRampToValueAtTime(.001, hit + 3.2);
    lp.connect(cg).connect(master);
    [55, 82.4, 110, 164.8, 220].forEach((f, i) => { const s = ac.createOscillator(); s.type = 'sawtooth'; s.frequency.value = f; s.detune.value = (i%2?7:-7); s.connect(lp); s.start(hit); s.stop(hit + 3.3); });
  } catch(e) {}
}
function stopSound(fade=200) {
  soundNodes.forEach(g => { try { g.gain.setTargetAtTime(0, audioCtx.currentTime, fade/3000); } catch(_){} });
  soundNodes = [];
}

/* ======================= BOOT ======================= */
function boot() {
  $('#navLogo').src = LOGO_NAV; $('#pLogo').src = LOGO_NAV; $('#footLogo').src = LOGO_NAV; $('#yr').textContent = new Date().getFullYear();
  applyTheme();
  render();
  let seen = false; try { seen = sessionStorage.getItem('lasteast:introSeen') === '1'; } catch(_){}
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const skipParam = /[?&]nointro\b/.test(location.search);
  const deep = decodeURIComponent((location.hash.match(/^#play=(.+)$/) || [])[1] || '');
  if (deep && app(deep) && app(deep).url) {
    $('#app').classList.remove('pre');
    try { history.replaceState(null, '', location.pathname + location.search); history.pushState({lePlayer: deep}, '', '#play=' + encodeURIComponent(deep)); } catch(_){}
    openPlayer(app(deep), true);
  } else if (S.settings.intro && !(S.settings.introOnce && seen) && !reduce && !skipParam) playIntro();
  else { $('#app').classList.remove('pre'); $('#app').classList.add('enter'); }
}
boot();
})();
</script>
